<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScreenSense · Your habits</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <header class="topbar">
    <a class="wordmark" href="#">ScreenSense</a>

    <button
      id="themeToggle"
      class="theme-toggle"
      type="button"
      aria-label="Switch to dark theme"
    >
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" />
        <path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6
                 M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8
                 M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" />
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" />
      </svg>
    </button>
  </header>

  <main class="page">
    <section class="intro">
      <p class="step-count">Step 1 of 3</p>
      <h1>How do you use your phone?</h1>
      <p class="lede">
        Slide each one to where a normal day lands.
        The face tells you how it feels about it.
      </p>
    </section>

    <form class="questions" id="questions" autocomplete="off">
      <!-- Each slider is built by js/sliders.js from this list -->
    </form>

    <div class="actions">
      <button class="btn-primary" type="button" id="nextBtn">
        Next: your habits
      </button>
    </div>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/face.js"></script>
  <script src="js/sliders.js"></script>
</body>
</html>
